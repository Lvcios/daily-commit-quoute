<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote of the Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Georgia,serif;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:rgba(255,255,255,.95);color:#333;padding:3rem 2rem;border-radius:20px;max-width:600px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.quote{font-size:1.6rem;line-height:1.5;margin-bottom:1rem;font-style:italic}
.author{font-size:1.1rem;color:#555}
.date{font-size:.85rem;color:#888;text-transform:uppercase;letter-spacing:2px;margin-bottom:2rem}
</style>
</head>
<body>
<div class="card">
<div class="date">2026-09-21</div>
<div class="quote">"The golden opportunity you are seeking is in yourself. It is not in your environment; it is not in luck or chance, or the help of others; it is in yourself alone."</div>
<div class="author">— Orison Swett Marden</div>
</div>
</body>
</html>
